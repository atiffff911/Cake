<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Happy Birthday Aqsa</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@500;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(180deg,#fdf6f0,#f0dcd0);font-family:Poppins,sans-serif;min-height:100vh;overflow:hidden;user-select:none;-webkit-user-select:none;display:flex;align-items:center;justify-content:center}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes hb{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
@keyframes pu{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes fu{0%{transform:translateY(100vh);opacity:0}10%{opacity:.8}90%{opacity:.8}100%{transform:translateY(-100px);opacity:0}}
@keyframes so{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--x),var(--y)) scale(0);opacity:0}}
@keyframes fall{to{transform:translateY(105vh) rotate(900deg);opacity:0}}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes pop{0%{transform:translateX(-50%) scale(0) rotate(-180deg);opacity:0}70%{transform:translateX(-50%) scale(1.1) rotate(10deg);opacity:1}100%{transform:translateX(-50%) scale(1) rotate(0);opacity:1}}
@keyframes gridIn{0%{opacity:0;transform:scale(.85)}100%{opacity:1;transform:scale(1)}}
@keyframes flame{0%,100%{transform:scale(1) translateY(0);opacity:1}50%{transform:scale(1.1) translateY(-2px);opacity:.9}}

.gtw:active{transform:scale(.97)}

.dl::before,.dr::before{content:'♥';position:absolute;top:22%;left:50%;transform:translateX(-50%);font-size:30px;color:rgba(255,255,255,.9)}
.dl::after,.dr::after{content:'♥';position:absolute;bottom:22%;left:50%;transform:translateX(-50%);font-size:20px;color:rgba(255,255,255,.7)}
.gtw.open .dl{transform:rotateY(-125deg)}
.gtw.open .dr{transform:rotateY(125deg)}

.sp{position:fixed;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 12px 4px rgba(255,255,255,.9);pointer-events:none;z-index:50;animation:so 1s ease-out forwards}
